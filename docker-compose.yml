name: xhs-all-in-one
services:
  app:
    image: xhs-all-in-one:local
    build: .
    container_name: xhs-all-in-one
    init: true
    ports:
      - "0.0.0.0:18081:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./backend/app/storage:/app/backend/app/storage
    env_file:
      - .env
    environment:
      CONFIG_FILE: /app/config/default.yaml
      FRONTEND_SERVE_STATIC: "true"
      SCHEDULER_ENABLED: "false"
      DATABASE_SQLITE_PATH: /app/data/spider_xhs.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
